<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NYX - Field Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" data-theme="blue">

    <!-- ===== HERO / BRAND HEADER ===== -->
    <header class="hero">
      <svg class="hero__art" viewBox="0 0 430 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#eaf7ff" />
            <stop offset="45%" stop-color="#8fd3ff" />
            <stop offset="100%" stop-color="#8fd3ff" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#04081a" stop-opacity="0" />
            <stop offset="75%" stop-color="#04081a" stop-opacity="0" />
            <stop offset="100%" stop-color="#04081a" stop-opacity="0.5" />
          </linearGradient>
        </defs>

        <!-- angled panel dividers (behind everything) -->
        <polygon points="430,0 430,150 280,0" fill="#00256b" opacity="0.5" />
        <polygon points="430,25 430,115 335,25" fill="#0057f7" opacity="0.28" />

        <!-- moon -->
        <circle cx="122" cy="92" r="95" fill="url(#moonGlow)" opacity="0.55" />
        <circle cx="122" cy="92" r="46" fill="url(#moonGlow)" />

        <!-- constellation -->
        <g stroke="#7fd8ff" stroke-width="1" opacity="0.4">
          <line x1="228" y1="38" x2="268" y2="60" />
          <line x1="268" y1="60" x2="252" y2="100" />
          <line x1="268" y1="60" x2="318" y2="48" />
          <line x1="318" y1="48" x2="358" y2="82" />
          <line x1="358" y1="82" x2="352" y2="128" />
        </g>
        <g fill="#bdeaff" opacity="0.9">
          <circle cx="228" cy="38" r="1.8" />
          <circle cx="268" cy="60" r="1.8" />
          <circle cx="252" cy="100" r="1.8" />
          <circle cx="318" cy="48" r="1.8" />
          <circle cx="358" cy="82" r="1.8" />
          <circle cx="352" cy="128" r="1.8" />
        </g>

        <!-- crystal shards near the moon -->
        <g fill="#9fe0ff">
          <polygon points="66,58 106,28 96,80 58,90" opacity="0.2" />
          <polygon points="152,42 186,62 160,98 130,80" opacity="0.16" />
          <polygon points="36,118 76,106 68,150 26,152" opacity="0.14" />
          <polygon points="178,110 206,124 186,148" opacity="0.12" />
        </g>
        <g fill="none" stroke="#bdeaff" stroke-width="1">
          <polygon points="66,58 106,28 96,80 58,90" opacity="0.3" />
          <polygon points="152,42 186,62 160,98 130,80" opacity="0.25" />
          <polygon points="36,118 76,106 68,150 26,152" opacity="0.22" />
        </g>

        <!-- diamond confetti, spread across the whole width -->
        <g fill="#7fd8ff">
          <rect width="16" height="16" transform="rotate(45 356 148)" opacity="0.55" />
          <rect width="9" height="9" transform="rotate(45 396 186)" opacity="0.4" />
          <rect width="22" height="22" transform="rotate(45 20 210)" opacity="0.4" />
          <rect width="11" height="11" transform="rotate(45 298 18)" opacity="0.35" />
          <rect width="13" height="13" transform="rotate(45 210 150)" opacity="0.3" />
          <rect width="8" height="8" transform="rotate(45 168 200)" opacity="0.3" />
          <rect width="10" height="10" transform="rotate(45 405 40)" opacity="0.3" />
          <rect width="7" height="7" transform="rotate(45 250 175)" opacity="0.25" />
        </g>

        <!-- distant skyline -->
        <path d="M0,300 L0,236 L18,236 L18,212 L40,212 L40,226 L62,226 L62,194 L86,194 L86,218 L108,218 L108,180 L136,180 L136,222 L162,222 L162,198 L188,198 L188,234 L214,234 L214,204 L238,204 L238,226 L262,226 L262,186 L286,186 L286,216 L312,216 L312,240 L340,240 L340,210 L364,210 L364,238 L390,238 L390,214 L430,214 L430,300 Z"
          fill="#050a18" opacity="0.95" />
        <g stroke="#4a86d6" stroke-width="1" opacity="0.4">
          <line x1="108" y1="180" x2="108" y2="150" />
          <line x1="238" y1="204" x2="238" y2="178" />
        </g>

        <rect x="0" y="0" width="430" height="300" fill="url(#heroFade)" />
      </svg>

      <div class="hero__brand">
        <span class="hero__mark">NYX</span>
        <span class="hero__sub">Field Calculator</span>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main">

      <!-- CALCULATE VIEW -->
      <section class="view" data-view="calculate">
        <div class="display cut-corner-lg">
          <p class="display__label">Calculator</p>
          <div class="display__trail" id="expression"></div>
          <input class="display__result" type="text" id="display" disabled value="0" />
        </div>

        <div class="buttons">
          <button class="btn paren" data-value="(">(</button>
          <button class="btn paren" data-value=")">)</button>
          <button class="btn clear" data-action="clear">C</button>
          <button class="btn delete" data-action="delete" aria-label="Backspace">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M8.5 5h11A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-11L3 12l5.5-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M10.5 9.5l6 6m0-6l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>

          <button class="btn" data-value="7">7</button>
          <button class="btn" data-value="8">8</button>
          <button class="btn" data-value="9">9</button>
          <button class="btn operator" data-value="/">÷</button>

          <button class="btn" data-value="4">4</button>
          <button class="btn" data-value="5">5</button>
          <button class="btn" data-value="6">6</button>
          <button class="btn operator" data-value="*">×</button>

          <button class="btn" data-value="1">1</button>
          <button class="btn" data-value="2">2</button>
          <button class="btn" data-value="3">3</button>
          <button class="btn operator" data-value="-">−</button>

          <button class="btn" data-value="0">0</button>
          <button class="btn" data-value=".">.</button>
          <button class="btn equals" data-action="equals">=</button>
          <button class="btn operator" data-value="+">+</button>
        </div>
      </section>

      <!-- HISTORY VIEW -->
      <section class="view" data-view="history" hidden>
        <div class="panel-card cut-corner-lg">
          <div class="panel-card__head">
            <p class="panel-card__title">History</p>
            <button type="button" class="text-btn" id="historyClear">Clear all</button>
          </div>
          <ul class="history__list" id="historyList">
            <li class="history__empty">No calculations yet</li>
          </ul>
        </div>
      </section>

      <!-- SETTINGS VIEW -->
      <section class="view" data-view="settings" hidden>
        <div class="panel-card cut-corner-lg">
          <p class="panel-card__title">Settings</p>

          <div class="settings__row">
            <span class="settings__label">Result precision</span>
            <div class="precision-select-wrap">
              <select class="precision-select" id="precisionSelect" aria-label="Result precision">
                <option value="auto">Auto</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
              </select>
            </div>
          </div>

          <div class="settings__row">
            <span class="settings__label">Accent</span>
            <div class="settings__options" data-setting="theme">
              <button type="button" class="chip chip--blue" data-value="blue" aria-label="Blue"></button>
              <button type="button" class="chip chip--red" data-value="red" aria-label="Red"></button>
              <button type="button" class="chip chip--violet" data-value="violet" aria-label="Violet"></button>
              <button type="button" class="chip chip--teal" data-value="teal" aria-label="Teal"></button>
              <label class="chip chip--custom" id="customColorLabel">
                <input type="color" id="customColorInput" value="#0057f7" aria-label="Custom color" />
              </label>
            </div>
          </div>

          <div class="settings__row">
            <span class="settings__label">Saved accents</span>
            <button type="button" class="chip chip--add" id="saveAccentBtn" aria-label="Save current color" title="Save current color">+</button>
          </div>
          <div class="saved-accents" id="savedAccentsList"></div>
        </div>
      </section>
    </main>

    <!-- ===== NAV RAIL ===== -->
    <nav class="rail">
      <button type="button" class="rail__item is-active" data-view="calculate"><span class="rail__arrow">▸</span>Calculate</button>
      <button type="button" class="rail__item" data-view="history"><span class="rail__arrow">▸</span>History</button>
      <button type="button" class="rail__item" data-view="settings"><span class="rail__arrow">▸</span>Settings</button>
    </nav>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <div class="footer__id">
        <svg class="footer__badge" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="none" stroke="#7fd8ff" stroke-width="1.4" />
          <circle cx="20" cy="20" r="12" fill="none" stroke="#7fd8ff" stroke-width="1" opacity="0.6" />
          <rect x="12" y="12" width="16" height="16" transform="rotate(45 20 20)" fill="none" stroke="#7fd8ff" stroke-width="1.2" />
          <circle cx="20" cy="20" r="2.4" fill="#7fd8ff" />
        </svg>
        <div class="footer__unit">
          <span class="footer__unit-name">NYX Unit</span>
          <span class="footer__unit-sub">Field Computation Division</span>
        </div>
      </div>
      <span class="footer__tagline">Trust the math</span>
    </footer>

  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
